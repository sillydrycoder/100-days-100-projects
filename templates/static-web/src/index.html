<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day {{DAY_PADDED}} — {{TITLE}}</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0f14;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      max-width: 680px;
      padding: 2rem;
      background: #111820;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span class="badge">DAY {{DAY_PADDED}} · {{CATEGORY_NAME}}</span>
    <h1>{{TITLE}}</h1>
    <p>{{SOLUTION}}</p>
  </main>
</body>
</html>
