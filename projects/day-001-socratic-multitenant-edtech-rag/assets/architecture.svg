<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Multi-Tenant Socratic EdTech RAG and Vision-Routing System Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="660" fill="url(#bgGrad)"/>
  <rect width="1200" height="660" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="36" y="24" width="236" height="24" rx="12" fill="#0d261f" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="154" y="40" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">DAY 001 · PRODUCTION ARCHITECTURE</text>
  <text x="36" y="80" fill="#f1f5f9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="700">Multi-Tenant Socratic EdTech RAG &amp; Vision-Routing Platform</text>
  <text x="36" y="102" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Strict School Isolation (PostgreSQL RLS) · Hierarchical Textbook Chunking · Vision-to-JSON Cache · Scale-to-Zero Serverless Infra</text>
  <rect x="36" y="116" width="1128" height="2" fill="url(#accentGrad)" opacity="0.4"/>

  <!-- Column 1: Clients & Ingestion -->
  <rect x="36" y="142" width="248" height="198" rx="12" fill="#101822" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="54" y="168" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1. MULTI-TENANT ENTRY</text>
  <rect x="54" y="182" width="212" height="58" rx="8" fill="#0a1017" stroke="#26384d"/>
  <text x="66" y="203" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Student Companion UI</text>
  <text x="66" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Text chat + diagram uploads</text>

  <rect x="54" y="252" width="212" height="72" rx="8" fill="#0a1017" stroke="#26384d"/>
  <text x="66" y="273" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">School Admin Portal</text>
  <text x="66" y="292" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Bulk CSV roster onboarding</text>
  <text x="66" y="309" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Grade/Class + PDF/MD textbooks</text>

  <!-- Ingestion Pipeline Box -->
  <rect x="36" y="362" width="248" height="176" rx="12" fill="#101822" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="54" y="388" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">2. HIERARCHICAL RAG ETL</text>
  <rect x="54" y="402" width="212" height="54" rx="8" fill="#0a1017" stroke="#312e81"/>
  <text x="66" y="422" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Structure-Aware Chunker</text>
  <text x="66" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Book → Chapter → Section → Page</text>
  <rect x="54" y="468" width="212" height="54" rx="8" fill="#0a1017" stroke="#312e81"/>
  <text x="66" y="488" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Atomic Block Preservation</text>
  <text x="66" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Intact Tables · LaTeX · Diagrams</text>

  <!-- Column 2: Stateful LangGraph Socratic Engine -->
  <rect x="328" y="142" width="496" height="396" rx="12" fill="#0e1a18" stroke="#10b981" stroke-width="1.6"/>
  <text x="348" y="168" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">3. STATEFUL SOCRATIC ORCHESTRATION GRAPH (7 NODES)</text>

  <!-- Node 1: PII -->
  <rect x="348" y="184" width="214" height="64" rx="8" fill="#0a1017" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="362" y="206" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 1 · FERPA/COPPA GUARD</text>
  <text x="362" y="224" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">PII Redaction &amp; Pseudonymize</text>
  <text x="362" y="239" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Strips names, emails, IDs pre-LLM</text>

  <!-- Node 2: Vision Cache -->
  <rect x="590" y="184" width="214" height="64" rx="8" fill="#0a1017" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="604" y="206" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 2 · VISION-TO-JSON</text>
  <text x="604" y="224" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">SHA-256 Diagram Cache</text>
  <text x="604" y="239" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Parse once → reuse JSON (-92% cost)</text>

  <!-- Node 3: Cost Router -->
  <rect x="348" y="274" width="456" height="68" rx="8" fill="#0a1017" stroke="#3b82f6" stroke-opacity="0.75"/>
  <text x="362" y="295" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 3 · COST-AWARE TIERED MODEL ROUTER</text>
  <text x="362" y="314" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9.8">fast ($0.00022) · reason ($0.00075) · vlm ($0.0038) · cache ($0.00028)</text>
  <text x="362" y="331" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Follow-up diagram turns route back to cheap text LLM via cached JSON topology</text>

  <!-- Node 4 & 5 -->
  <rect x="348" y="368" width="214" height="68" rx="8" fill="#0a1017" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="362" y="390" fill="#c4b5fd" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 4 · HYBRID RAG</text>
  <text x="362" y="408" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">BM25 + Dense Cosine RRF</text>
  <text x="362" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Hard-filtered by school_id + grade</text>

  <rect x="590" y="368" width="214" height="68" rx="8" fill="#0a1017" stroke="#10b981" stroke-opacity="0.7"/>
  <text x="604" y="390" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 5–6 · SOCRATIC GUARD</text>
  <text x="604" y="408" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Hint Ladder (1 → 2 → 3)</text>
  <text x="604" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Blocks premature direct-answer leaks</text>

  <!-- Node 7 -->
  <rect x="348" y="458" width="456" height="60" rx="8" fill="#0a1017" stroke="#2d3f56"/>
  <text x="362" y="480" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NODE 7 · TENANT AUDIT &amp; TELEMETRY LOG</text>
  <text x="362" y="499" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Logs pseudonymized turns, citations, latency &amp; per-school token spend</text>

  <!-- Column 3: Data & Serverless Scale-to-Zero -->
  <rect x="868" y="142" width="296" height="218" rx="12" fill="#101822" stroke="#10b981" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="886" y="168" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">4. ISOLATED DATA LAYER</text>
  <rect x="886" y="182" width="260" height="78" rx="8" fill="#0a1017" stroke="#1e293b"/>
  <text x="898" y="203" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PostgreSQL + pgvector (RLS)</text>
  <text x="898" y="221" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">FORCE ROW LEVEL SECURITY</text>
  <text x="898" y="238" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10">SET LOCAL app.current_school_id</text>
  <text x="898" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">50+ schools · 0 per-school DB migrations</text>

  <rect x="886" y="272" width="260" height="72" rx="8" fill="#0a1017" stroke="#1e293b"/>
  <text x="898" y="293" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Object Storage &amp; Vision Cache</text>
  <text x="898" y="311" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Tenant-prefixed PDFs (R2 / S3)</text>
  <text x="898" y="328" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Content-addressed diagram JSON</text>

  <rect x="868" y="382" width="296" height="156" rx="12" fill="#101822" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="886" y="408" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="11" font-weight="700">5. SEASONAL SCALE-TO-ZERO</text>
  <text x="886" y="432" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">200 Active Days vs. 165 Idle Days</text>
  <text x="886" y="454" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• API/UI: Cloud Run / Fly.io (min=0)</text>
  <text x="886" y="474" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• DB: Neon Serverless Postgres (auto-suspend)</text>
  <text x="886" y="494" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• AI: Serverless Token APIs + Modal GPU burst</text>
  <text x="886" y="518" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Near-$0 idle burn during school breaks</text>

  <!-- Connectors -->
  <line x1="284" y1="212" x2="344" y2="212" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="562" y1="216" x2="586" y2="216" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="697" y1="248" x2="697" y2="270" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="455" y1="342" x2="455" y2="364" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="562" y1="402" x2="586" y2="402" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="697" y1="436" x2="697" y2="454" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="284" y1="448" x2="324" y2="448" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="824" y1="252" x2="864" y2="252" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="824" y1="460" x2="864" y2="460" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Footer Strip -->
  <rect x="36" y="564" width="1128" height="68" rx="10" fill="#0c121b" stroke="#1e293b"/>
  <text x="58" y="592" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">KEY ENGINEERING GUARANTEES</text>
  <text x="58" y="614" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Zero Cross-Tenant Leakage (RLS)   ·   Intact Equations &amp; Tables   ·   No Direct-Answer Spoilers   ·   92.6% Vision Cache Savings   ·   1-Command Offline DEMO_MODE</text>
  <text x="1142" y="604" text-anchor="end" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">@sillydrycoder</text>
</svg>
